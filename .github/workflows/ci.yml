name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Imprint from secret
        env:
          IMPRESSUM_MD: ${{ secrets.IMPRESSUM_MD }}
        run: |
          if [ -n "$IMPRESSUM_MD" ]; then printf '%s\n' "$IMPRESSUM_MD" > legal/impressum.md; fi
      - run: npm run build
      - name: Stamp the build
        run: printf '%s\n' "$GITHUB_SHA" > dist/version.txt
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    # Only after a green build on main. The key can do nothing but rsync into the site directory (rrsync).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://discordtools.de
    steps:
      - name: Skip if main has moved on
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head, this run is $GITHUB_SHA – a newer run deploys instead"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.fresh.outputs.deploy == 'true'
        with:
          name: site
          path: dist
      - name: Upload to the server
        id: upload
        if: steps.fresh.outputs.deploy == 'true'
        env:
          SITE_HOST: ${{ secrets.SITE_HOST }}
          SITE_SSH_KEY: ${{ secrets.SITE_SSH_KEY }}
          SITE_KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          if [ -z "$SITE_HOST" ] || [ -z "$SITE_SSH_KEY" ] || [ -z "$SITE_KNOWN_HOSTS" ]; then
            echo "Deploy secrets are not set – skipped"; exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SITE_SSH_KEY" > ~/.ssh/site && chmod 600 ~/.ssh/site
          printf '%s\n' "$SITE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_cmd="ssh -i $HOME/.ssh/site -o IdentitiesOnly=yes -o BatchMode=yes"
          # 1) Hashed assets first and never deleted here: pages still cached in a browser keep finding
          #    their old JS/CSS. --ignore-times rewrites every current asset so its mtime is fresh; a cron job
          #    on the server removes assets that no deploy touched for 14 days.
          rsync -rl --ignore-times -e "$ssh_cmd" dist/_astro/ "dtsite@${SITE_HOST}:/_astro/"
          # 2) Pages after that, all at once; _astro is left alone.
          rsync -rl --checksum --delete-after --delay-updates --exclude=/_astro/ -e "$ssh_cmd" dist/ "dtsite@${SITE_HOST}:/"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
      - name: Live check
        if: steps.upload.outputs.uploaded == 'true'
        run: |
          for i in $(seq 1 15); do
            live=$(curl -fsS https://discordtools.de/version.txt 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live: $live"; exit 0; fi
            sleep 6
          done
          echo "::error::discordtools.de does not serve $GITHUB_SHA (got '${live:-nothing}')"; exit 1
